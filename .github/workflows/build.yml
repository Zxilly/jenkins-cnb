name: Build

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?(!)?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo 'Pull request titles must follow Conventional Commits.' >&2
            exit 1
          fi

  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "17"
            java_versions: |-
              17
              21
          - os: ubuntu-latest
            java: "21"
            java_versions: "21"
          - os: ubuntu-latest
            java: "25"
            java_versions: "25"
          - os: windows-latest
            java: "17"
            java_versions: |-
              17
              21
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java_versions }}
          cache: maven
      - name: Verify
        shell: bash
        run: ./mvnw -B -ntp -Dtest.jdk.version=${{ matrix.java }} -DforkCount=1C clean verify
      - name: Upload HPI
        if: matrix.os == 'ubuntu-latest' && matrix.java == '25'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cnb-hpi
          path: target/cnb.hpi
          if-no-files-found: error
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.java == '25'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: target/site/jacoco/jacoco.xml
          disable_search: true
          fail_ci_if_error: false

  build-gate:
    name: build-gate
    if: always()
    needs: [conventional-commit, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful verification
        env:
          CONVENTIONAL_COMMIT_RESULT: ${{ needs.conventional-commit.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          if [[ "$VERIFY_RESULT" != 'success' ]]; then
            echo "Verification matrix result: $VERIFY_RESULT" >&2
            exit 1
          fi
          if [[ "$CONVENTIONAL_COMMIT_RESULT" != 'success' && "$CONVENTIONAL_COMMIT_RESULT" != 'skipped' ]]; then
            echo "Conventional Commit validation result: $CONVENTIONAL_COMMIT_RESULT" >&2
            exit 1
          fi
