name: Release HPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  security-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/jenkins-security-scan.yml

  build:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |-
            17
            21
          cache: maven
      - name: Validate release tag and source branch
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-(${identifier})(\\.${identifier})*)?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"
          if [[ ! "$VERSION" =~ $pattern ]]; then
            echo 'Release tags must follow SemVer 2.0.0, for example v1.2.3, v1.2.3-rc.1, or v1.2.3+build.7.' >&2
            exit 1
          fi
          git fetch --no-tags origin master:refs/remotes/origin/master
          tag_commit="$(git rev-list -n 1 "$VERSION")"
          git merge-base --is-ancestor "$tag_commit" origin/master
          echo "TAG_COMMIT=$tag_commit" >> "$GITHUB_ENV"
      - name: Build release
        env:
          VERSION: ${{ github.ref_name }}
        run: >-
          ./mvnw -B -ntp
          -Drevision="${VERSION#v}"
          -Dchangelist=
          -DscmTag="$VERSION"
          -Dtest.jdk.version=17
          -DforkCount=1C
          clean verify
      - name: Verify HPI identity and bundled libraries
        env:
          VERSION: ${{ github.ref_name }}
        run: python3 scripts/verify-release.py target/cnb.hpi pom.xml
      - name: Create checksum
        working-directory: target
        run: sha256sum cnb.hpi > cnb.hpi.sha256
      - name: Stage release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cnb-release-${{ github.sha }}
          path: |
            target/cnb.hpi
            target/cnb.hpi.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    outputs:
      stable: ${{ steps.publish.outputs.stable }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse an existing published release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || {
              echo 'A published release already exists for this tag.' >&2
              exit 1
            }
          fi
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cnb-release-${{ github.sha }}
          path: target
      - name: Verify checksum
        working-directory: target
        run: sha256sum -c cnb.hpi.sha256
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/cnb.hpi
      - name: Publish GitHub release
        id: publish
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          version_without_build="${release_version%%+*}"
          release_flags=(--draft=false --title "$GITHUB_REF_NAME" --verify-tag)
          create_flags=(--title "$GITHUB_REF_NAME" --verify-tag --generate-notes)
          if [[ "$version_without_build" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            release_flags+=(--prerelease --latest=false)
            create_flags+=(--prerelease --latest=false)
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
            release_flags+=(--prerelease=false)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || {
              echo 'Refusing to replace assets on an existing published release.' >&2
              exit 1
            }
            gh release upload "$GITHUB_REF_NAME" target/cnb.hpi target/cnb.hpi.sha256 --clobber
            printf '%s\n' cnb.hpi cnb.hpi.sha256 | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
              | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
            diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
            gh release edit "$GITHUB_REF_NAME" "${release_flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              target/cnb.hpi \
              target/cnb.hpi.sha256 \
              "${create_flags[@]}"
          fi

  update-center:
    if: needs.publish.outputs.stable == 'true'
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/update-center.yml
    secrets: inherit
