name: Jenkins Security Scan

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # CodeQL 2.26.1 is the current stable bundle. Pin both its version and digest so the
      # analysis toolchain is reproducible and does not silently move ahead of validation.
      - name: Fetch verified CodeQL 2.26.1
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.1/codeql-bundle-linux64.tar.zst \
            -o "$RUNNER_TEMP/codeql-bundle-linux64.tar.zst"
          echo '02cb5f5d2ae8332ffc65b889eac2c88a4b57f5c66c5ebddc90ebf1c24eefcf67  '"$RUNNER_TEMP/codeql-bundle-linux64.tar.zst" \
            | sha256sum -c --strict

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java
          build-mode: manual
          tools: ${{ runner.temp }}/codeql-bundle-linux64.tar.zst
          config: |
            disable-default-queries: true
            packs:
              - jenkins-infra/jenkins-codeql@0.0.3
              - codeql/java-queries:AlertSuppression.ql
              - codeql/java-queries:AlertSuppressionAnnotations.ql

      # The pinned CodeQL bundle supports Kotlin compilers <2.4.10. This analysis-only build
      # uses compiler 2.4.0 with the unchanged production sources, kotlin-stdlib, and dependencies.
      # Normal/release builds use kotlin.version throughout. Remove the profile once the pinned
      # stable bundle includes github/codeql#22194.
      - name: Trace production Kotlin sources
        run: ./mvnw -B -ntp -V -Pcodeql-kotlin-compat -DskipTests clean package

      - name: Run CodeQL
        id: generate-sarif
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: Jenkins Security Scan
          upload: failure-only

      - name: Process SARIF
        shell: bash
        run: |
          jq '
            (.runs[]?.tool.driver.name) = "Jenkins Security Scan"
            | (.runs[]?.tool.driver.organization) = "Jenkins Project"
            | (.runs[]?.results) |= map(select(((.suppressions // []) | length) == 0))
          ' ../results/java.sarif > jenkins-security-scan.sarif
          mv -v ../results/java.sarif .

      - name: Archive SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: "*.sarif"
          name: Jenkins Security Scan SARIF
          if-no-files-found: error

      - name: Upload scan result
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: jenkins-security-scan.sarif
          category: Jenkins Security Scan

      - name: Require no unsuppressed findings
        shell: bash
        run: |
          finding_count="$(jq '[.runs[]?.results[]?] | length' jenkins-security-scan.sarif)"
          if [[ "$finding_count" -ne 0 ]]; then
            jq -r '.runs[]?.results[]? | "\(.ruleId // "unknown-rule"): \(.message.text // "CodeQL finding")"' \
              jenkins-security-scan.sarif >&2
            echo "Jenkins Security Scan found $finding_count unsuppressed result(s)." >&2
            exit 1
          fi
